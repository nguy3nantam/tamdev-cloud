# Chuyển hướng www → apex để tránh trùng lặp nội dung (SEO).
server {
    listen 80;
    server_name www.tamdev.cloud;
    return 301 https://tamdev.cloud$request_uri;
}

server {
    listen 80;
    server_name tamdev.cloud;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — include riêng ở từng location vì nginx bỏ qua
    # add_header cấp server khi location con tự khai báo add_header khác.
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml application/rss+xml;
    gzip_min_length 1024;

    location ^~ /_astro/ {
        include /etc/nginx/security-headers.conf;
        # Hashed assets — chỉ một header cache-control duy nhất (không dùng
        # `expires` chung với `add_header` vì nginx sẽ sinh 2 header trùng).
        add_header Cache-Control "public, immutable, max-age=31536000" always;
    }

    location /blog/ {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location = / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=60";
        # Phải phục vụ trực tiếp /index.html trong location này, nếu không
        # internal redirect sang /index.html sẽ rơi vào location / và
        # làm mất header Cache-Control.
        try_files /index.html =404;
    }

    location ~* \.(svg|png|jpg|jpeg|webp|avif|ico|css|js)$ {
        include /etc/nginx/security-headers.conf;
        expires 1d;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Trang 404 tùy chỉnh
    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/security-headers.conf;
        internal;
    }
}
